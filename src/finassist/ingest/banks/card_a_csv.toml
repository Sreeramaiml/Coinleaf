# Card A credit card, CSV export (synthetic layout used by the demo and tests).
# One amount column with a Dr/Cr suffix, DD-MM-YYYY dates, optional foreign-currency
# columns, summary rows for the previous and current balance (owed amounts carry "Dr").
name = "Card A credit card CSV"
file_kind = "csv"
headers = ["Transaction Date", "Details", "Reference", "Foreign Amount", "Foreign Currency", "Amount"]
date_formats = ["%d-%m-%Y"]
amount_mode = "amount_suffix"
default_payment_method = "card"
account_last4_pattern = 'Card Number\s*:\s*[X*\s]+(\d{4})'
period_pattern = 'Billing Period\s*:\s*(?P<start>\d{2}-\d{2}-\d{4})\s*to\s*(?P<end>\d{2}-\d{2}-\d{4})'
period_date_formats = ["%d-%m-%Y"]

[columns]
date = "Transaction Date"
description = "Details"
ref = "Reference"
orig_amount = "Foreign Amount"
orig_currency = "Foreign Currency"
amount = "Amount"

[summary_labels]
opening = "Previous Balance"
closing = "Current Balance"
